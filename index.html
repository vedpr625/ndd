<style>
/* Layout concept: a ledger-style workbench. Left rail for the six registers, a table-first main pane, and a right-hand drawer that carries every governance action. */
:root{
  --bg:#F2F6F6; --surface:#FFFFFF; --surface-2:#E8EFEF; --ink:#13262A; --ink-2:#4B6165; --line:#D3DEDF;
  --accent:#0E6A70; --accent-ink:#FFFFFF; --accent-soft:#DBEEEF;
  --ok:#1D7448; --ok-ink:#FFFFFF; --ok-bg:#DFF1E7; --warn:#845400; --warn-bg:#FAEDCB; --bad:#9F2430; --bad-bg:#FADFE0; --info:#1E4C9C; --info-bg:#E1EAFA; --muted:#566A6E; --muted-bg:#E3EAEB;
  --shadow:0 12px 40px rgba(10,30,34,.18);
  --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1618; --surface:#142124; --surface-2:#1B2C30; --ink:#E4EFEF; --ink-2:#9BB1B4; --line:#263B3F;
  --accent:#4DC0C6; --accent-ink:#04282B; --accent-soft:#143A3D;
  --ok:#62D194; --ok-ink:#06281A; --ok-bg:#143626; --warn:#F0C262; --warn-bg:#3A2D10; --bad:#FF8E94; --bad-bg:#401B1F; --info:#93B6FF; --info-bg:#1B2A4A; --muted:#9BB1B4; --muted-bg:#1F3236;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1618; --surface:#142124; --surface-2:#1B2C30; --ink:#E4EFEF; --ink-2:#9BB1B4; --line:#263B3F;
  --accent:#4DC0C6; --accent-ink:#04282B; --accent-soft:#143A3D;
  --ok:#62D194; --ok-ink:#06281A; --ok-bg:#143626; --warn:#F0C262; --warn-bg:#3A2D10; --bad:#FF8E94; --bad-bg:#401B1F; --info:#93B6FF; --info-bg:#1B2A4A; --muted:#9BB1B4; --muted-bg:#1F3236;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;margin:0;padding-inline:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:6px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}
.brand .mk{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.04em}
.brand b{display:block;font-size:14px;line-height:1.15}.brand span{font-size:11.5px;color:var(--ink-2)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;border-radius:8px;padding:9px 10px;text-align:left;cursor:pointer;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:11px;font-weight:600;padding:1px 7px;min-width:20px;text-align:center}
.rail .grow{flex:1}
.ref{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;color:var(--ink-2)}
.ref b{color:var(--ink);display:flex;align-items:center;gap:6px;font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.pane{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{margin:0;font-size:17px;font-weight:650}
.top .sub{color:var(--ink-2);font-size:12.5px}
.who{white-space:nowrap;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.who select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-weight:500}
.scroll{flex:1;overflow:auto;padding:20px 24px 40px;min-width:0}
.note{background:var(--info-bg);color:var(--info);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 4px;font-weight:650}
.lede{color:var(--ink-2);margin:0 0 14px;max-width:70ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent);font-weight:600}
.tabs .n{font-size:11px;background:var(--muted-bg);color:var(--muted);border-radius:99px;padding:0 6px;margin-left:4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .sp{flex:1}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.bar input[type=text],.bar select{width:auto;min-width:180px}
textarea{resize:vertical;min-height:64px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);font-weight:600;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.muted{background:var(--muted-bg);color:var(--muted)}.chip.info{background:var(--info-bg);color:var(--info)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.solid{background:var(--ok);color:var(--ok-ink)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.sys{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink-2);background:var(--surface);white-space:nowrap}
.kind{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600}
.dim{color:var(--ink-2)}
.pip{display:inline-block;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);font-size:10px;text-align:center;line-height:15px;font-weight:700;color:var(--ink-2);margin-right:3px}
.pip.on{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.mine{color:var(--accent);font-weight:600;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{border-color:var(--accent)}
.card h3{margin:0;font-size:14px;font-weight:600}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.empty{padding:32px;text-align:center;color:var(--ink-2)}
.drawer-bg{position:fixed;inset:0;background:rgba(5,20,22,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dh h3{margin:2px 0 4px;font-size:16px;font-weight:650;overflow-wrap:anywhere}
.x{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-2);padding:2px 6px}
.db{flex:1;overflow:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:18px}
.df{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center;background:var(--surface)}
.df .why{flex:1;color:var(--ink-2);font-size:12.5px;min-width:200px}
.sec h4{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);font-weight:650}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--ink-2)}.kv dd{margin:0;overflow-wrap:anywhere}
.steps{display:flex;gap:0;margin:2px 0}
.steps li{list-style:none;flex:1;text-align:center;font-size:11px;color:var(--ink-2);position:relative;padding-top:16px}
.steps li::before{content:"";position:absolute;top:3px;left:0;right:0;height:3px;background:var(--line)}
.steps li.done::before{background:var(--accent)}
.steps li.cur{color:var(--accent);font-weight:700}
.steps li.cur::after{content:"";position:absolute;top:0;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--accent)}
.steps{padding:0;margin:0}
.checks{display:flex;flex-direction:column;gap:6px}
.ck{display:flex;gap:8px;font-size:13px;align-items:flex-start}
.ck i{font-style:normal;font-weight:700;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none;margin-top:1px}
.ck.ok i{background:var(--ok-bg);color:var(--ok)}.ck.warn i{background:var(--warn-bg);color:var(--warn)}.ck.fail i{background:var(--bad-bg);color:var(--bad)}
.map{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.map .end{border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.map .mid{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;font-size:11px;color:var(--ink-2)}
.thread{display:flex;flex-direction:column;gap:10px}
.msg{background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:13px}
.msg b{font-weight:600}.msg small{color:var(--ink-2);margin-left:6px}
.fr{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fr label,.fr .lab{font-weight:600;font-size:12.5px}
.fr .hint{font-size:12px;color:var(--ink-2)}
.fr .err{font-size:12px;color:var(--bad);display:none;font-weight:550}
.fr.bad .err{display:block}.fr.bad input,.fr.bad select,.fr.bad textarea{border-color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fs{border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 14px}
.fs legend{font-weight:650;padding:0 6px;font-size:13px}
.choice{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:4px 0}
.choice input{width:auto;margin-top:3px}
.res{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.res button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px;cursor:pointer;align-items:baseline}
.res button:last-child{border-bottom:0}.res button:hover{background:var(--surface-2)}
.res button[disabled]{opacity:.55;cursor:not-allowed}
.picked{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:9px 11px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.outcome{border-radius:8px;padding:10px 12px;font-size:13px;background:var(--surface-2)}
.frac{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;margin:4px 0}
.frac .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);font-weight:650}
.rule{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--surface)}
.rule .mono{color:var(--accent)}
.drawer table{min-width:0}.drawer .fs,.drawer .fr,.row2>*{min-width:0}.drawer td,.drawer th{padding:8px 10px}
.colrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr) minmax(0,1.3fr) auto auto;gap:6px;align-items:center;margin-bottom:8px}
.colrow input[type=text],.colrow select{padding:6px 8px}
@media (max-width:860px){.colrow{grid-template-columns:1fr 1fr}}
.stage td{vertical-align:middle}
.rollout table{min-width:0}.rollout td,.rollout th{padding:8px 10px}
.divider{height:1px;background:var(--line);margin:2px 0}
pre.code{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.5;margin:0;max-height:360px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.two>*{min-width:0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:40;font-weight:550;font-size:13px;box-shadow:var(--shadow)}
.mobile-nav{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px;align-items:center}
  .brand,.ref,.rail .grow{display:none}
  .nav{flex-direction:row}.nav button{white-space:nowrap}
  .top,.scroll{padding-inline:16px}
  .two{grid-template-columns:minmax(0,1fr)}
  .row2{grid-template-columns:1fr}
  .kv{grid-template-columns:110px minmax(0,1fr)}
  .map{grid-template-columns:1fr}.map .mid{flex-direction:row}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
<style>
/* Proposal skin: keeps the current NDD Governance layout (header, left rail, hero, cards, tabs) and its navy and teal look. */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --surface-2:#EDF2F7; --ink:#0F2A43; --ink-2:#506579; --line:#DCE4ED;
  --accent:#0F766E; --accent-ink:#FFFFFF; --accent-soft:#D8F1EE; --navy:#0B3C6E; --navy-ink:#FFFFFF;
  --mark:#B45309; --mark-ink:#FFFFFF;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1624; --surface:#122234; --surface-2:#192E44; --ink:#E6EEF6; --ink-2:#9DB2C6; --line:#243A52;
  --accent:#4FD1C5; --accent-ink:#042F2E; --accent-soft:#12403F; --navy:#3A7CC0; --navy-ink:#FFFFFF; --mark:#FBBF24; --mark-ink:#1C1100}}
:root[data-theme="dark"]{
  --bg:#0B1624; --surface:#122234; --surface-2:#192E44; --ink:#E6EEF6; --ink-2:#9DB2C6; --line:#243A52;
  --accent:#4FD1C5; --accent-ink:#042F2E; --accent-soft:#12403F; --navy:#3A7CC0; --navy-ink:#FFFFFF; --mark:#FBBF24; --mark-ink:#1C1100}
.shell{display:flex;flex-direction:column;height:100%}
.gh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.gbrand{display:flex;gap:12px;align-items:center}
.gbrand .mk{width:38px;height:38px;border-radius:50%;background:var(--navy);color:var(--navy-ink);display:grid;place-items:center;font-weight:800;font-size:11px;letter-spacing:.04em}
.gt{font-weight:800;font-size:17px;display:flex;gap:8px;align-items:center}
.pill{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 9px}
.gs{font-size:12px;color:var(--ink-2)}
.gtools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn.icon{padding:8px 12px}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:var(--mark-ink)}
.gbody{flex:1;display:grid;grid-template-columns:268px minmax(0,1fr);min-height:0}
.gbody.mini{grid-template-columns:68px minmax(0,1fr)}
.rail{padding:16px 12px;gap:4px}
.gl{font-size:11px;letter-spacing:.09em;font-weight:700;color:var(--ink-2);padding:12px 10px 6px}
.nav button{align-items:center;justify-content:flex-start;gap:12px;padding:9px 10px;position:relative}
.nav button svg{flex:none}
.nav .nt{display:flex;flex-direction:column;min-width:0;flex:1;text-align:left}
.nav .nt b{font-weight:650;font-size:14px;color:var(--ink)}
.nav .nt small{font-size:11.5px;color:var(--ink-2)}
.nav button[aria-current="page"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);border-radius:10px}
.nav button[aria-current="page"] .nt b,.nav button[aria-current="page"] svg{color:var(--accent)}
.ucard{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.ucard .urow{display:flex;gap:10px;align-items:center}
.av{width:36px;height:36px;border-radius:10px;background:var(--navy);color:var(--navy-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.ucard small{color:var(--ink-2);display:block}
.ucard select{padding:6px 8px;font-size:12.5px}
.collapse{background:none;border:0;color:var(--ink-2);padding:10px;text-align:left;cursor:pointer;font-weight:600}
.gbody.mini .nt,.gbody.mini .gl,.gbody.mini .ucard,.gbody.mini .ct,.gbody.mini .badge{display:none}
.crumb{font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:18px;box-shadow:0 1px 2px rgba(15,42,67,.05)}
.hicon{width:52px;height:52px;border-radius:14px;background:var(--navy);color:var(--navy-ink);display:grid;place-items:center;flex:none}
.htxt{flex:1;min-width:220px}.htxt h1{margin:0 0 2px;font-size:22px;font-weight:800}.htxt p{margin:0;color:var(--ink-2);max-width:70ch}
.hact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:15;display:flex;flex-direction:column}
.menu button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:600}
.menu button:hover{background:var(--surface-2)}
.menu small{display:block;color:var(--ink-2);font-weight:400}
.seg{display:inline-flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;flex-wrap:wrap;margin-bottom:14px}
.seg button{background:none;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--ink-2)}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.seg .n{opacity:.8;margin-left:4px;font-weight:500}
.card{border-radius:14px;box-shadow:0 1px 2px rgba(15,42,67,.06);padding:16px;gap:10px}
.card.static{cursor:default}.card.static:hover{border-color:var(--line)}
.cardtop{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.codechip{font-family:var(--mono);font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent);border-radius:7px;padding:3px 9px;overflow-wrap:anywhere}

function checks(it){
  const c=[],ok=t=>c.push({l:'ok',t}),w=t=>c.push({l:'warn',t}),wd=t=>c.push({l:'warn',t,dep:true}),f=t=>c.push({l:'fail',t});
  if(it.kind==='code'){
    ok('Local code is unique in '+it.system+'.');
    const cs=find('cs',it.system);
    if(cs&&!['approved','published'].includes(cs.status))wd('Code system '+it.system+' is '+STATUS[cs.status][0].toLowerCase()+'. Approve it first.');
    if(!it.target) w('No standard target. Records with this code load as terminology-unresolved and wait for a Terminology Specialist.');
    else{
      const r=lookup(it.target.sys,it.target.code);
      if(!r) f('Target code was not found on the country terminology server.');
      else if(!r.active) f(SYS[r.sys].short+' '+r.code+' is inactive. Pick an active code.');
      else ok(SYS[r.sys].short+' '+r.code+' exists and is active.');
      if(!it.equiv) f('Choose an equivalence.');
      else if(EQUIV[it.equiv].auto) ok('Equivalence "'+EQUIV[it.equiv].l.toLowerCase()+'": ETL applies this mapping automatically.');
      else w('Equivalence "'+EQUIV[it.equiv].l.toLowerCase()+'": ETL sends matching records to review instead of applying it.');
      if(it.clin) w('Needs clinician review before approval.');
    }
  }
  if(it.kind==='ds'){
    ok('Identifier is unique.');
    if(!it.cols.length)f('Add at least one column.');
    const names=it.cols.map(c=>c.name);
    if(new Set(names).size!==names.length)f('Column names must be unique.');
    const bad=it.cols.filter(c=>c.el&&find('el',c.el)&&!EL2COL[find('el',c.el).type].includes(c.type));
    bad.forEach(c=>f('Column '+c.name+' is '+c.type+', but data element '+c.el+' is '+find('el',c.el).type+'.'));
    if(!bad.length)ok('Column types match their data elements.');
    const pend=it.cols.filter(c=>c.el&&!['approved','published'].includes((find('el',c.el)||{}).status));
    if(pend.length)wd(pend.length+' column'+(pend.length>1?'s':'')+' read data elements that are not approved yet. Approve them first.');
    if(!it.cols.some(c=>c.key))w('No key column is marked.');
    if(it.cert)ok('Certified by the warehouse.');else w('Not certified by the warehouse yet. KPIs that read it cannot sync to DHIS2 until it is.');
  }
  if(it.kind==='cs'){
    ok('Identifier is unique.');
    const n=DB.code.filter(c=>c.system===it.id).length;
    if(n)ok(n+' local code'+(n>1?'s':'')+' use this system.');else w('No local codes yet. Add codes after the system is approved.');
    if(it.owner.length<3)f('Name the team that maintains it.');
  }
  if(it.kind==='vs'){
    if(!it.members.length) f('ValueSet has no members. Add the code list before submitting.');
    else ok(it.members.length+' explicit members. No filters or hierarchy, so it expands on GPS content.');
    const bad=it.members.filter(m=>m[0]!=='local'&&!(lookup(m[0],m[1])||{}).active);
    if(bad.length) f(bad.length+' member code(s) are inactive or missing on the country server.');
    else if(it.members.length) ok('All standard members are active.');
    const loc=it.members.filter(m=>m[0]==='local'&&find('code',m[1])&&!['approved','published'].includes(find('code',m[1]).status));
    if(loc.length) w(loc.length+' local member(s) have mappings that are not approved yet.');
    if(it.members.some(m=>m[0]==='local')&&it.members.some(m=>m[0]!=='local')) w('Mixes local and standard codes. Local codes only match data whose code was not converted to a standard code.');
    if(it.note) w(it.note);
  }
  if(it.kind==='kpi'){
    [['Denominator',it.denom],['Numerator',it.numer]].forEach(([l,v])=>{
      if(v.startsWith('vs:')){const s=vsStatusOf(v.slice(3));
        if(['approved','published'].includes(s)) ok(l+' ValueSet '+v.slice(3)+' is '+STATUS[s][0].toLowerCase()+'.');
        else wd(l+' ValueSet '+v.slice(3)+' is '+(STATUS[s]||['unknown'])[0].toLowerCase()+'. Approve it first.');}
      else{const e=find('el',v.slice(3));
        if(e&&['approved','published'].includes(e.status))ok(l+' reads data element '+e.id+'.');
        else wd(l+' reads data element '+v.slice(3)+', which is '+(e?STATUS[e.status][0].toLowerCase():'unknown')+'. Approve it first.');}
    });
    const dsx=find('ds',it.ds);
    if(!dsx)f('Choose the dataset this KPI reads.');
    else if(!['approved','published'].includes(dsx.status))wd('Dataset '+dsx.id+' is '+STATUS[dsx.status][0].toLowerCase()+'. Approve it first.');
    else if(!dsx.cert)w('Dataset '+dsx.id+' is not certified yet. DHIS2 sync waits for certification.');
    else ok('Reads certified dataset '+dsx.id+'.');
    if(it.win==='none') w('No time window. Events count on any date. Confirm with the programme whether a window is needed.');
    else ok('Time window set: '+winLabel(it.win)+'.');
    if(it.sup>=5) ok('Small-cell suppression at '+it.sup+' or fewer.'); else w('Suppression threshold is below 5.');
    if(it.extra) w(it.extra);
  }
  if(it.kind==='el'){
    if(it.path){if(it.path.split(/[. ]/)[0]!==it.res) f('FHIR path should start with '+it.res+'.'); else ok('FHIR path matches the resource.');} else ok('Not tied to FHIR. Source: '+srcLabel(it)+'.');
    if(it.type==='code'&&!it.vs) f('A coded element needs a ValueSet before it can be submitted.');
    else if(it.vs){const s=vsStatusOf(it.vs); if(['approved','published'].includes(s)) ok('Bound to '+it.vs+' ('+it.strength+').'); else wd('Bound to '+it.vs+', which is '+(STATUS[s]||['unknown'])[0].toLowerCase()+'. Approve it first.');}
    if(!DB.ds.some(d=>d.cols.some(c=>c.el===it.id)))w('Not loaded into any schema yet, so no warehouse column carries it.');
    if(it.sens==='Quasi-identifier') w('Quasi-identifier. Generalised in research extracts and subject to small-cell rules.');
  }
  return c;
}
function impact(it){

}

function act(kind,key){

    const blk=checks(it).filter(c=>c.l==='fail'||c.dep);if(blk.length){toast('Cannot approve yet: '+blk[0].t);return}
    if(it.clin){const cb=document.getElementById('clin-ok');if(!cb||!cb.checked){toast('Confirm the clinician review first');return}it.clin=false;post(it,'Clinician review confirmed.')}

  render();if(S.drawer&&S.drawer.mode==='detail')openDetail(key);
}

  L.push('data_elements:');pub.filter(i=>i.kind==='el').forEach(e=>L.push('  - id: '+e.id,'    programme: '+e.prog,'    version: '+e.version,'    source: ['+(e.src&&e.src.length?e.src:['fhir']).join(', ')+']','    fhir_path: '+(e.path?'"'+e.path+'"':'null'),'    binding: '+(e.vs?e.vs+' ('+e.strength+')':'none')));

  return L.join('\n');

const STAGES=[['etl','ETL import','Imports the schema and mapping tables',null],['dw','Warehouse build','Builds tables and certified views','etl'],['dhis2','DHIS2 sync','Creates or updates indicators and data elements','dw'],['bi','BI semantic layer','Refreshes measures and certified datasets','dw']];
function rolloutBlock(){
  const r=RELEASES[0],st=r.rollout,adm=!!me().release;
  const rows=STAGES.map(([k,l,d,pre])=>{const done=st[k]==='done',blocked=!done&&pre&&st[pre]!=='done';
    const chp=done?'<span class="chip ok">Done</span>':blocked?`<span class="chip muted">Waiting for ${STAGES.find(x=>x[0]===pre)[1]}</span>`:'<span class="chip warn">Ready to run</span>';
    return `<tr class="stage"><td><b>${l}</b></td><td class="dim">${d}</td><td>${chp}</td><td>${!done&&!blocked?`<button class="btn" data-stage="${k}" ${adm?'':'disabled title="Only the system administrator runs rollout steps"'}>Run</button>`:''}</td></tr>`}).join('');
  const cons=Object.entries(CONSUMERS).map(([k,c])=>`<tr><td><b>${c.name}</b></td><td class="mono">${c.pin}</td><td>${c.pin===r.v?'<span class="chip ok">Current</span>':'<span class="chip warn">Behind '+r.v+'</span>'}</td></tr>`).join('');
  return `<div class="two rollout" style="margin-bottom:26px"><div><h2>Rollout of ${r.v}</h2><p class="lede">Steps run in order. DHIS2 syncs last, after ETL has imported the schema and the warehouse has built it.</p>${table(['Step','What it does','State',''],rows)}</div><div><h2>Consumers</h2><p class="lede">The release each system is running.</p>${table(['Consumer','Pinned to','State'],cons)}</div></div>`;
}
function runStage(k){
  const r=RELEASES[0];r.rollout[k]='done';CONSUMERS[k].pin=r.v;
  let note='';
  if(k==='dw'){const n=DB.ds.filter(d=>d.status==='published'&&!d.cert);n.forEach(d=>{d.cert=true});note=n.length?' · '+n.length+' dataset'+(n.length>1?'s':'')+' certified':''}
  if(k==='dhis2'){const ready=DB.kpi.filter(x=>x.status==='published'&&(find('ds',x.ds)||{}).cert);ready.forEach(x=>{x.sync={ver:x.version}});
    const held=DB.kpi.filter(x=>x.status==='published'&&!(find('ds',x.ds)||{}).cert).length;note=' · '+ready.length+' synced'+(held?', '+held+' held until their dataset is certified':'')}
  AUDIT.push({t:'11 Oct now',who:me().name,role:me().role,act:'Rollout step done: '+STAGES.find(x=>x[0]===k)[1],tgt:r.v});
  toast(STAGES.find(x=>x[0]===k)[1]+' done'+note);render();
}

    main=`<div class="sec"><h4>Specification</h4><dl class="kv"><dt>Layer</dt><dd>${it.layer}</dd><dt>One row is</dt><dd>${esc(it.grain)}</dd><dt>Certification</dt><dd>${it.cert?'<span class="chip ok">Certified by the warehouse</span>':'<span class="chip warn">Not certified</span>'}</dd></dl></div><div class="sec"><h4>Columns (${it.cols.length})</h4>${table(['Column','Type','Source data element','Note'],it.cols.map(c=>{const x=c.el?find('el',c.el):null;return `<tr><td class="mono">${esc(c.name)}${c.key?' <span class="chip muted">key</span>':''}</td><td class="mono">${c.type}</td><td>${c.el?`<span class="mono">${esc(c.el)}</span>${x?' '+chip(x.status):' <span class="chip bad">Missing</span>'}`:'<span class="dim">–</span>'}</td><td class="dim">${esc(c.note||'')}</td></tr>`}).join(''))}</div>`;
  }
  if(it.kind==='kpi'){
    main=`<div class="sec"><h4>Rule</h4><div class="frac"><span class="lbl">Numerator</span><div class="rule">${ruleText(it.numer)}</div><span class="lbl">Denominator</span><div class="rule">${ruleText(it.denom)}</div></div><dl class="kv" style="margin-top:12px"><dt>Definition</dt><dd>${esc(it.definition)}</dd><dt>Unit</dt><dd>${it.unit}</dd><dt>Time window</dt><dd>${winLabel(it.win)}</dd><dt>Breakdowns</dt><dd>${it.dims.map(d=>dimLabel[d]).join(', ')}, plus facility from the registry</dd><dt>Cadence</dt><dd>${it.cad}</dd><dt>Small cells</dt><dd>Hidden at ${it.sup} or fewer</dd></dl></div>`+kpiUse(it)+`<div class="sec"><h4>How this appears in DHIS2</h4>${d2html(it)}</div>`;
  }
  if(it.kind==='el'){
    main=`<div class="sec"><h4>Specification</h4><dl class="kv"><dt>Definition</dt><dd>${esc(it.def)}</dd><dt>Type</dt><dd>${it.type}, ${it.card}</dd><dt>Source</dt><dd>${esc(srcLabel(it))}${it.hint?`<div class="dim">${esc(it.hint)}</div>`:''}</dd><dt>FHIR path</dt><dd>${it.path?`<span class="mono">${esc(it.path)}</span>`:'<span class="dim">Not mapped to FHIR</span>'}</dd><dt>Canonical column</dt><dd class="mono">${esc(it.id)}</dd><dt>Bound to</dt><dd>${it.vs?`<span class="mono">${it.vs}</span> (${it.strength})`:'<span class="dim">None</span>'}</dd><dt>When empty</dt><dd>${it.nulls.map(n=>({not_recorded:'Not recorded',unknown:'Unknown',not_applicable:'Not applicable'}[n])).join(', ')}</dd><dt>Handling</dt><dd>${it.sens}</dd><dt>Warehouse column</dt><dd>${warehouseCols(it)}</dd></dl></div>`;
  }
  const ck=checks(it);
  const thread=it.thread.length?`<div class="thread">${it.thread.map(m=>`<div class="msg"><b>${esc(m.who)}</b><small>${m.role} · ${m.t}</small><div>${esc(m.text)}</div></div>`).join('')}</div>`:'<div class="dim">No comments yet.</div>';
  const m=me(),blk=reviewBlock(it);
  const isAuthor=m.author&&['draft','changes'].includes(it.status);
  let foot='';
  if(isAuthor){const fl=failing(it).length;foot=`<span class="why">${fl?fl+' check'+(fl>1?'s':'')+' must pass before submitting.':'Ready to submit.'}</span><button class="btn" data-edit="${key}">Edit</button><button class="btn pri" data-act="submit" data-key="${key}" ${fl?'disabled':''}>${it.status==='changes'?'Resubmit':'Submit (opens pull request)'}</button>`}
  else if(['submitted','in_review'].includes(it.status)){
    const nb=checks(it).filter(c=>c.l==='fail'||c.dep).length;
    foot=`<span class="why">${blk||(nb?'Cannot approve yet: '+nb+' check'+(nb>1?'s':'')+' open. Request changes or wait for the dependencies.':'Add a comment if you request changes.')}</span>`+(!blk?`<button class="btn bad" data-act="changes" data-key="${key}">Request changes</button><button class="btn ok" data-act="approve" data-key="${key}" ${nb?'disabled':''}>Approve</button>`:(it.by===S.me?`<button class="btn" data-act="retract" data-key="${key}">Withdraw</button>`:''));
  }else if(it.status==='approved')foot=`<span class="why">Both reviews are in. The system administrator merges the pull request and tags the release from Releases.</span>`;
  else if(it.status==='published')foot=`<span class="why">Merged and tagged. Changing it opens a new branch and a new pull request.</span>${m.author?`<button class="btn" data-edit="${key}">New version</button>`:''}`;
  const reviewing=!blk&&['submitted','in_review'].includes(it.status);
  layer(`<div class="dh"><div><div class="kind">${KIND[it.kind]}</div><h3>${esc(it.kind==='code'?it.id+' · '+it.display:it.kind==='kpi'?it.title:it.kind==='vs'?it.title:it.title)}</h3><div class="meta" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${chip(it.status)}<span class="mono dim">${it.id}</span><span class="mono dim">v${it.version}</span></div></div><button class="x" data-close aria-label="Close">×</button></div>
  <div class="db">${steps}${main}
  <div class="sec"><h4>Git</h4><dl class="kv"><dt>State</dt><dd><span class="chip ${gitInfo(it).st[1]}">${gitInfo(it).st[0]}</span></dd><dt>Branch</dt><dd class="mono">${esc(gitInfo(it).br)}</dd><dt>File</dt><dd class="mono">${esc(gitInfo(it).file)}</dd><dt>Release tag</dt><dd>${it.status==='published'?'<span class="mono">v0.'+(relCount-1)+'.0</span>':'<span class="dim">Added when the release is tagged</span>'}</dd></dl><p class="dim" style="margin:6px 0 0">This screen is a front end for the repository. Every change is a pull request on that file.</p></div>
  <div class="sec"><h4>Automated validation (CI)</h4><div class="checks">${ck.map(c=>`<div class="ck ${c.l}"><i>${c.l==='ok'?'✓':c.l==='warn'?'!':'×'}</i><span>${c.dep?'<span class="chip warn">Blocks approval</span> ':''}${esc(c.t)}</span></div>`).join('')}</div></div>
  <div class="sec"><h4>Pull request reviews</h4><dl class="kv"><dt>Data steward</dt><dd>${it.appr.steward?'✓ '+esc(it.appr.steward):'<span class="dim">Pending</span>'}</dd><dt>Programme owner</dt><dd>${it.appr.owner?'✓ '+esc(it.appr.owner):'<span class="dim">Pending</span>'}</dd><dt>Programme</dt><dd>${esc(progName(it.prog))}</dd>${it.prev?`<dt>Live version</dt><dd>v${esc(it.prev.version)} stays live until this version is released</dd>`:''}<dt>Submitted by</dt><dd>${esc(person(it.by))}</dd></dl></div>
  <div class="sec"><h4>Used by</h4><ul style="margin:0;padding-left:18px">${impact(it).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div class="sec"><h4>Discussion</h4>${thread}${reviewing&&it.clin?'<div class="choice" style="margin-top:10px"><input type="checkbox" id="clin-ok"><label for="clin-ok">A clinician has reviewed this mapping</label></div>':''}${reviewing?`<div class="fr" style="margin-top:10px"><label for="cmt">Comment</label><textarea id="cmt" placeholder="Required when you request changes"></textarea><div class="err" id="cmt-err">Write at least a short reason so the author knows what to fix.</div></div>`:''}</div></div>
  <div class="df">${foot}</div>`);
}

/* ---------- forms ---------- */
function field(id,label,inner,hint,req){return `<div class="fr" data-fr="${id}"><label for="${id}">${label}${req?' *':''}</label>${inner}${hint?`<div class="hint">${hint}</div>`:''}<div class="err" data-err="${id}"></div></div>`}
function progSel(id,cur,noShared){const o=Object.entries(PROGS).map(([k,v])=>[k,v.name]);if(!noShared)o.push(['*','Shared across programmes']);return field(id,'Programme',`<select id="${id}">${opts(o,cur||(S.prog!=='all'?S.prog:''),'Choose…')}</select>`,'',1)}
function opts(list,sel,ph){return (ph!=null?`<option value="">${ph}</option>`:'')+list.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(l)}</option>`}).join('')}
function setErr(id,msg){const f=document.querySelector(`[data-fr="${id}"]`);if(!f)return;f.classList.toggle('bad',!!msg);const e=f.querySelector('.err');if(e)e.textContent=msg||''}
const val=id=>{const e=document.getElementById(id);return e?(e.type==='checkbox'?e.checked:e.value.trim()):''};

function toggleNewCs(){const n=document.getElementById('newcs');if(n)n.hidden=val('f-sys')!=='__new'}
function mapDyn(){
  const local=document.getElementById('mt-local').checked;

  if(!local&&exp&&!exp.includes(ts))t+='<div class="dim" style="margin-top:6px"><b>Check:</b> '+esc(RESL[kind]||kind)+' codes usually map to '+exp.map(k=>SYS[k].short).join(' or ')+'. Keep '+esc(SYS[ts].short)+' only if that is deliberate.</div>';

function mapResults(){
  const q=val('f-search').toLowerCase(),sys=val('f-tsys');
  const rs=REF.filter(r=>r.sys===sys&&(!q||(r.code+' '+r.display).toLowerCase().includes(q))).slice(0,6);

function validateMap(strict){
  const errs={};const code=val('f-code'),sys=val('f-sys');
  if(sys==='__new'){
    const nid=val('nc-id').toUpperCase();
    if(!/^[A-Z][A-Z0-9_]{3,31}$/.test(nid))errs['nc-id']='Use 4 to 32 capital letters, digits or underscores, starting with a letter.';
    else if(find('cs',nid))errs['nc-id']='This identifier is already used.';
    if(val('nc-title').length<3)errs['nc-title']='Enter a name.';
    if(!val('nc-prog'))errs['nc-prog']='Choose the programme, or Shared.';
    if(!val('nc-stype'))errs['nc-stype']='Choose the kind of source system.';
    if(strict){if(val('nc-owner').length<3)errs['nc-owner']='Say who maintains the codes.';if(val('nc-desc').length<10)errs['nc-desc']='Describe what it covers in a sentence.'}
  }
  if(!sys)errs['f-sys']='Choose the local code system, or add a new one.';
  if(!code||code.length>64||!/^\S+( \S+)*$/.test(code))errs['f-code']='Enter the code exactly as the source writes it: 1 to 64 characters, no spaces at the ends, no double spaces.';
  else{const cx=find('cs',sys),ci=cx&&cx.cased===false;if(DB.code.some(c=>c.system===sys&&c.id!==MF.edit&&(ci?c.id.toLowerCase()===code.toLowerCase():c.id===code)))errs['f-code']='This code already exists in '+sys+(ci?' (codes in this system are not case sensitive).':'.');}
  if(val('f-display').length<3)errs['f-display']='Enter the name used by the source system.';
  if(strict){
    if(!val('f-res'))errs['f-res']='Choose the kind of code.';
    if(val('f-summary').length<4)errs['f-summary']='Say in a few words why this code is needed or what changed.';
    if(MF.type==='map'){
      if(!MF.picked)errs['f-pick']='Pick a standard code from the list.';
      if(!val('f-equiv'))errs['f-equiv']='Choose how close the match is.';
      if(val('f-reason').length<10)errs['f-reason']='Give a reason of at least a few words.';
    }
  }
  ['f-sys','f-code','f-display','f-res','f-pick','f-equiv','f-reason','f-summary','nc-prog','nc-id','nc-stype','nc-title','nc-owner','nc-desc'].forEach(k=>setErr(k,errs[k]));
  return errs;
}
function saveMap(mode){
  const errs=validateMap(mode==='submit');if(Object.keys(errs).length){const k=Object.keys(errs)[0];const el=document.getElementById(k);if(el)el.focus();document.getElementById('mf-why').textContent='Fix the highlighted fields.';return}
  const code=val('f-code');
  let sysId=val('f-sys');
  if(sysId==='__new'){
    const ncs=Object.assign(mk({}),{kind:'cs',prog:val('nc-prog'),id:val('nc-id').toUpperCase(),stype:val('nc-stype'),cased:val('nc-case')!=='no',title:val('nc-title'),owner:val('nc-owner'),desc:val('nc-desc'),version:'0.1.0',by:S.me,status:'draft'});
    DB.cs.push(ncs);log('Saved draft',ncs);
    if(mode==='submit'){ncs.status='submitted';post(ncs,'Submitted together with local code '+code+'.');log('Submitted for review',ncs)}
    sysId=ncs.id;
  }
  const csx=find('cs',sysId)||{};
  const base={kind:'code',prog:csx.prog==='*'?(S.prog!=='all'?S.prog:'*'):(csx.prog||'*'),id:code,system:sysId,display:val('f-display'),res:val('f-res'),target:MF.type==='map'&&MF.picked?{sys:MF.picked.sys,code:MF.picked.code}:null,equiv:MF.type==='map'?val('f-equiv')||null:null,clin:MF.type==='map'&&val('f-clin'),rationale:val('f-reason'),summary:val('f-summary')};
  let it=find('code',MF.edit||code);
  if(it){const wasLive=['published','approved'].includes(it.status);keepLive(it);Object.assign(it,base);if(wasLive)it.version=bump(it.version,(document.querySelector('input[name=bump]:checked')||{}).value||'minor');it.appr={steward:null,owner:null}}
  else{it=Object.assign(mk({}),base,{version:'0.1.0',by:S.me,status:'draft',thread:[]});DB.code.push(it)}
  it.by=S.me;it.status='draft';
  if(mode==='submit'){const f=failing(it);if(f.length){toast(f[0].t);openMapForm(it);return}it.status='submitted';post(it,'Submitted for review.');log('Submitted for review',it)}
  else log('Saved draft',it);
  toast(mode==='submit'?'Submitted for review':'Draft saved');S.route='terminology';S.tabs.terminology='codes';render();openDetail(keyOf(it));
}

function validateGen(strict){

  else{it=Object.assign(mk({}),d,{kind:'vs',id:val('v-id'),version:'0.1.0'});DB.vs.push(it)}
  it.by=S.me;it.status='draft';it.appr={steward:null,owner:null};
  if(mode==='submit'){const f=failing(it);if(f.length){toast(f[0].t);openVsForm(it);return}it.status='submitted';post(it,'Submitted for review. '+d.summary);log('Submitted for review',it)}else log('Saved draft',it);
  toast(mode==='submit'?'Submitted for review':'Draft saved');S.route='terminology';S.tabs.terminology='vs';render();openDetail(keyOf(it));
}

/* schema form */
let DF=null;
function openDsForm(existing){
  DF={edit:existing?existing.id:null,cols:existing?existing.cols.map(c=>Object.assign({},c)):[{name:'',type:'string',el:'',key:true}]};S.drawer={mode:'form',kind:'ds'};
  const e=existing||{id:'',title:'',layer:'mart',grain:''};
  layer(`<div class="dh"><div><div class="kind">${existing?'New version of':'New'} schema</div><h3>${existing?esc(e.id):'Canonical dataset or mart'}</h3></div><button class="x" data-close aria-label="Close">×</button></div>
  <form class="db" id="df" novalidate>
   <fieldset class="fs"><legend>1. Dataset</legend>
    ${progSel('d-prog',e.prog)}
    <div class="row2">${field('d-id','Identifier',`<input type="text" id="d-id" class="mono" value="${esc(e.id)}" ${existing?'readonly':''} placeholder="programme_case_mart" autocomplete="off">`,'Lower case with underscores. Cannot change later.',1)}
    ${field('d-layer','Layer',`<select id="d-layer">${opts([['staging','Staging'],['curated','Curated'],['mart','Mart']],e.layer)}</select>`,'',1)}</div>
    ${field('d-title','Name',`<input type="text" id="d-title" value="${esc(e.title)}" placeholder="A name people will recognise">`,'',1)}
    ${field('d-grain','What one row represents',`<input type="text" id="d-grain" value="${esc(e.grain)}" placeholder="One row per patient event">`,'State the grain. KPI counts depend on it.',1)}
   </fieldset>
   <fieldset class="fs"><legend>2. Columns</legend>
    <p class="hint" style="margin:0 0 10px">Link a column to a data element so its type and meaning stay in step. Leave it unlinked for keys and derived fields.</p>
    <div id="d-cols"></div><div data-fr="d-columns"><div class="err" data-err="d-columns"></div></div>
    <button type="button" class="btn" data-addcol>Add column</button>
   </fieldset>
   <fieldset class="fs"><legend>3. Version</legend>${existing?bumpRadios():'<div class="dim" style="margin-bottom:10px">New schemas start at v0.1.0. The warehouse certifies the dataset after it is built.</div>'}${field('d-sum','What changed',`<input type="text" id="d-sum" placeholder="One line for the reviewers">`,'',1)}</fieldset>
  </form>
  <div class="df"><span class="why" id="df-why"></span><button class="btn" data-close>Cancel</button><button class="btn" data-dsave="draft">Save draft (branch)</button><button class="btn pri" data-dsave="submit">Submit (opens pull request)</button></div>`);
  dsCols();
}
function dsCols(){
  const el=document.getElementById('d-cols');if(!el)return;
  el.innerHTML=DF.cols.map((c,i)=>`<div class="colrow"><input type="text" class="mono" data-ci="${i}" data-cf="name" value="${esc(c.name)}" placeholder="column_name" aria-label="Column ${i+1} name" autocomplete="off"><select data-ci="${i}" data-cf="type" aria-label="Column ${i+1} type">${opts(COLT,c.type)}</select><select data-ci="${i}" data-cf="el" aria-label="Column ${i+1} data element">${opts(DB.el.map(x=>[x.id,x.id+' · '+x.type]),c.el,'No data element')}</select><label class="choice" style="margin:0"><input type="checkbox" data-ci="${i}" data-cf="key" ${c.key?'checked':''}>Key</label><button type="button" class="btn" data-rmcol="${i}" aria-label="Remove column ${i+1}">×</button></div>`).join('')||'<div class="dim" style="margin-bottom:8px">No columns yet.</div>';
}
function validateDs(strict){
  const errs={},id=val('d-id');
  if(!val('d-prog'))errs['d-prog']='Choose the programme this belongs to, or Shared.';
  if(!/^[a-z][a-z0-9_]{2,40}$/.test(id))errs['d-id']='Use lower case letters, digits and underscores, starting with a letter.';
  else if(!DF.edit&&find('ds',id))errs['d-id']='This identifier is already used.';
  if(val('d-title').length<3)errs['d-title']='Enter a name.';
  if(val('d-grain').length<5)errs['d-grain']='Say what one row represents.';
  const names=DF.cols.map(c=>c.name.trim());
  if(!DF.cols.length)errs['d-columns']='Add at least one column.';
  else if(names.some(n=>!/^[a-z][a-z0-9_]*$/.test(n)))errs['d-columns']='Every column needs a lower case name with underscores.';
  else if(new Set(names).size!==names.length)errs['d-columns']='Column names must be unique.';
  else{const bad=DF.cols.find(c=>c.el&&find('el',c.el)&&!EL2COL[find('el',c.el).type].includes(c.type));if(bad)errs['d-columns']='Column '+bad.name+' is '+bad.type+', but element '+bad.el+' is '+find('el',bad.el).type+'.'}
  if(strict&&val('d-sum').length<4)errs['d-sum']='Say what changed.';
  ['d-prog','d-id','d-title','d-grain','d-columns','d-sum'].forEach(k=>setErr(k,errs[k]));return errs;
}
function saveDs(mode){
  const errs=validateDs(mode==='submit');if(Object.keys(errs).length){const el=document.getElementById(Object.keys(errs)[0]);if(el)el.focus();document.getElementById('df-why').textContent='Fix the highlighted fields.';return}
  const d={prog:val('d-prog'),title:val('d-title'),layer:val('d-layer'),grain:val('d-grain'),cols:DF.cols.map(c=>({name:c.name.trim(),type:c.type,el:c.el||'',key:!!c.key,note:c.note||''})),summary:val('d-sum')};
  let it=DF.edit?find('ds',DF.edit):null;
  if(it){const live=['published','approved'].includes(it.status);const t=(document.querySelector('input[name=bump]:checked')||{}).value||'minor';keepLive(it);Object.assign(it,d);if(live){it.version=bump(it.version,t);it.cert=false}}
  else{it=Object.assign(mk({}),d,{kind:'ds',id:val('d-id'),version:'0.1.0',cert:false});DB.ds.push(it)}
  it.by=S.me;it.status='draft';it.appr={steward:null,owner:null};
  if(mode==='submit'){const f=failing(it);if(f.length){toast(f[0].t);openDsForm(it);return}it.status='submitted';post(it,'Submitted for review. '+d.summary);log('Submitted for review',it)}else log('Saved draft',it);
  toast(mode==='submit'?'Submitted for review':'Draft saved');S.route='schemas';render();openDetail(keyOf(it));
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-open],[data-qtab],[data-ttab],[data-new],[data-map],[data-edit],[data-act],[data-close],[data-save],[data-gsave],[data-dsave],[data-addcol],[data-rmcol],[data-stage],[data-csave],[data-vsave],[data-vadd],[data-vrm],[data-pick],[data-unpick],[data-release],[data-copy]');
  if(!t)return;const d=t.dataset;
  if(d.go!==undefined){S.route=d.go;S.q='';closeDrawer();render();try{history.replaceState(null,'','#'+d.go)}catch(_){}}
  else if(d.open)openDetail(d.open);
  else if(d.qtab){S.tabs.queue=d.qtab;render()}
  else if(d.ttab){S.tabs.terminology=d.ttab;S.q='';render()}
  else if(d.new){d.new==='code'?openMapForm(null):d.new==='vs'?openVsForm(null):d.new==='cs'?openCsForm(null):d.new==='ds'?openDsForm(null):openGeneric(d.new,null)}
  else if(d.map)openMapForm(null,d.map);
  else if(d.edit){const it=find(...d.edit.split('|'));it.kind==='code'?openMapForm(it):it.kind==='vs'?openVsForm(it):it.kind==='cs'?openCsForm(it):it.kind==='ds'?openDsForm(it):openGeneric(it.kind,it)}
  else if(d.act){if(d.act==='changes'){const ta=$('#cmt');if(ta&&ta.value.trim().length<8){setErrBox();return}}act(d.act,d.key)}
  else if(t.hasAttribute('data-close'))closeDrawer();
  else if(d.save)saveMap(d.save);
  else if(d.gsave)saveGen(d.gsave);
  else if(d.csave)saveCs(d.csave);
  else if(d.dsave)saveDs(d.dsave);
  else if(t.hasAttribute('data-addcol')){DF.cols.push({name:'',type:'string',el:'',key:false});dsCols();setErr('d-columns','')}
  else if(d.rmcol!==undefined){DF.cols.splice(+d.rmcol,1);dsCols()}
  else if(d.stage)runStage(d.stage);
  else if(d.vsave)saveVs(d.vsave);
  else if(d.vadd){const [a,b]=d.vadd.split('|');VF.members.push([a,b]);vsMembers();vsResults();setErr('v-members','')}
  else if(d.vrm!==undefined){VF.members.splice(+d.vrm,1);vsMembers();vsResults()}
  else if(d.pick){const [s,c]=d.pick.split('|');MF.picked={sys:s,code:c};setErr('f-pick','');mapDyn();document.getElementById('f-results').innerHTML=''}
  else if(t.hasAttribute('data-unpick')){MF.picked=null;mapDyn();document.getElementById('f-search').focus();mapResults()}
  else if(t.hasAttribute('data-release')){
    const items=releaseItems();items.forEach(i=>{i.status='published';delete i.prev});
    const note=(document.getElementById('rn')||{}).value||'';RELEASES.unshift({v:'v0.'+relCount+'.0',d:'11 Oct 2026',n:note,c:all().filter(i=>i.status==='published').length,rollout:{etl:'pending',dw:'pending',dhis2:'pending',bi:'pending'}});
    AUDIT.push({t:'11 Oct now',who:me().name,role:me().role,act:'Tagged release v0.'+relCount+'.0',tgt:items.length+' items'});relCount++;toast('Release tagged');render()}
  else if(t.hasAttribute('data-copy')){const x=(document.getElementById('yaml')||{}).textContent||'';try{navigator.clipboard.writeText(x).then(()=>toast('Copied'),()=>toast('Select the text to copy'))}catch(_){toast('Select the text to copy')}}
});
function setErrBox(){const ta=$('#cmt');if(ta){ta.closest('.fr').classList.add('bad');ta.focus()}}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.drawer)closeDrawer();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card[data-open]')){e.preventDefault();openDetail(e.target.dataset.open)}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(DF&&S.drawer&&S.drawer.kind==='ds'){const ci=e.target.dataset&&e.target.dataset.ci;if(ci!==undefined&&e.target.dataset.cf==='name')DF.cols[+ci].name=e.target.value;if(id==='d-id')e.target.value=e.target.value.toLowerCase();if(['d-id','d-title','d-grain'].includes(id))validateDs(false)}
  if(S.drawer&&S.drawer.kind==='vs'&&VF){if(id==='v-search')vsResults();if(id==='v-id'){e.target.value=e.target.value.toLowerCase();const u=document.getElementById('v-url');if(u)u.textContent=vsUrl(e.target.value||'id')}if(['v-id','v-title'].includes(id))validateVs(false)}
  if(id==='nc-id')e.target.value=e.target.value.toUpperCase();
  if(S.drawer&&S.drawer.kind==='cs'&&CF){if(id==='c-id'){e.target.value=e.target.value.toUpperCase();const u=document.getElementById('c-url'),f=document.getElementById('c-fid');if(u)u.textContent=csUrl(e.target.value||'ID');if(f)f.textContent=fhirId(e.target.value||'id')}if(['c-id','c-title','c-owner'].includes(id))validateCs(false)}
  if(id==='q'){S.q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}
  if(MF&&S.drawer&&S.drawer.kind==='code'){
    if(id==='f-search')mapResults();
    if(id==='f-equiv'||id==='mt-map'||id==='mt-local')mapDyn();
    if(['f-code','f-display','f-reason'].includes(id)){if(id==='f-code')validateMap(false)}
  }
  if(GF&&S.drawer&&S.drawer.kind===GF.kind&&id&&id.startsWith('g-')){if(id==='g-res'){const p=$('#g-path');if(p&&!p.value)p.placeholder=e.target.value?e.target.value+'.code':'Procedure.code'}}
});
document.addEventListener('change',e=>{
  if(e.target.id==='formsel'){const k=e.target.value;e.target.value='';if(!k)return;S.me=me().author?S.me:'requester';const f={code:()=>openMapForm(null),vs:()=>openVsForm(null),cs:()=>openCsForm(null),kpi:()=>openGeneric('kpi'),el:()=>openGeneric('el'),ds:()=>openDsForm(null)}[k];if(S.me&&!me().author){S.me='requester';render()}f()}
  const id=e.target.id;
  if(DF&&S.drawer&&S.drawer.kind==='ds'){const ci=e.target.dataset&&e.target.dataset.ci;if(ci!==undefined){const c=DF.cols[+ci],f=e.target.dataset.cf;c[f]=f==='key'?e.target.checked:e.target.value;if(f==='el'&&c.el){const x=find('el',c.el);if(x){c.type=EL2COL[x.type][0];dsCols()}}}}
  if(S.drawer&&S.drawer.kind==='vs'&&VF&&id==='v-sys'){document.getElementById('v-search').value='';vsResults()}
  if(id==='stat'){S.stat=e.target.value;render()}
  if(id==='prog'){S.prog=e.target.value;closeDrawer();render()}
  if(id==='persona'){S.me=e.target.value;closeDrawer();render()}
  if(MF&&S.drawer&&S.drawer.kind==='code'){
    if(id==='f-sys'){toggleNewCs();if(val('f-sys')==='__new'){const n=document.getElementById('nc-id');if(n)n.focus()}}
    if(id==='f-tsys'){MF.picked=null;document.getElementById('f-search').value='';mapDyn();mapResults()}
    if(id==='f-equiv'||id==='mt-map'||id==='mt-local'||id==='f-res')mapDyn();
  }
});
document.addEventListener('focusin',e=>{if(e.target.id==='f-search'&&MF&&S.drawer&&S.drawer.kind==='code')mapResults();if(e.target.id==='v-search'&&VF&&S.drawer&&S.drawer.kind==='vs')vsResults()});
document.addEventListener('submit',e=>e.preventDefault());

</script>

<script>
/* ---------- proposal shell: overrides the workbench screens with the V2.4 layout ---------- */
ROUTES.length=0;
ROUTES.push(['catalogue','NDD Catalogue'],['kpis','KPI Registry'],['elements','Data Elements'],['terminology','Terminology'],['queue','Review Queue'],['schemas','Schemas'],['releases','Releases'],['audit','Audit Log']);
TITLES.catalogue=['NDD Catalogue','Released definitions only: KPIs, data elements, ValueSets and local codes. Drafts and items under review stay in the registers.'];
TITLES.kpis=['KPI Registry','Indicator definitions written as rules over ValueSets. Each version is reviewed before release.'];
TITLES.elements=['Data Elements','What is collected, where the value comes from (CSV, SQL, FHIR or other), and which ValueSet it is bound to.'];
TITLES.terminology=['Terminology','Local codes, their mappings to standard codes, and the ValueSets that group them. Standard terminologies stay on the country terminology server.'];
TITLES.queue=['Review Queue','Everything waiting for a decision. The proposed rule is two approvals, one data steward and one programme owner. You cannot approve what you submitted.'];
S.me='requester';S.route='terminology';S.tabs.terminology='reg';S.tabs.treg='codes';S.sysf='all';S.rq='';S.rsys='all';S.cq='';S.ctype='all';
const IC={
 catalogue:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
 kpis:'<circle cx="6" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M6 8v4a4 4 0 0 0 4 4h6"/>',
 elements:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
 terminology:'<path d="M4 5a2 2 0 0 1 2-2h5v17H6a2 2 0 0 0-2 2zM20 5a2 2 0 0 0-2-2h-5v17h5a2 2 0 0 1 2 2z"/>',
 queue:'<path d="M4 13l2-8h12l2 8M4 13v6h16v-6M4 13h5l1 2h4l1-2h5"/>',
 schemas:'<path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/>',
 releases:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>',
 audit:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>'
};
const svg=(k,sz)=>`<svg viewBox="0 0 24 24" width="${sz||20}" height="${sz||20}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
const NAVSUB={catalogue:'National Data Dictionary',kpis:'Indicator Definitions',elements:'Element Specifications',terminology:'Code Sets & Value Sets',queue:'Pending decisions',schemas:'Canonical datasets',releases:'Rollout & consumers',audit:'Who did what'};

function render(){
  const nm=all().filter(inProg).filter(needsMe).length;
  const item=r=>`<button data-go="${r}" ${S.route===r?'aria-current="page"':''} title="${esc(TITLES[r][0])}">${svg(r)}<span class="nt"><b>${esc(ROUTES.find(x=>x[0]===r)[1])}</b><small>${NAVSUB[r]}</small></span>${r==='queue'&&nm?`<span class="badge" aria-label="${nm} waiting for you">${nm}</span>`:''}</button>`;
  $('#nav').innerHTML=`<div class="gl">CATALOGUE &amp; REGISTRY</div>`+['catalogue','kpis','elements','terminology'].map(item).join('')+`<div class="gl">GOVERNANCE &amp; RELEASE</div>`+['queue','schemas','releases','audit'].map(item).join('');
  $('#prog').innerHTML=`<option value="all">All programmes</option>`+Object.entries(PROGS).map(([k,v])=>`<option value="${k}" ${k===S.prog?'selected':''}>${v.name}</option>`).join('');
  const m=me();
  $('#ucard').innerHTML=`<div class="urow"><div class="av">${esc(m.name.split(' ').map(w=>w[0]).slice(0,2).join(''))}</div><div><b>${esc(m.name)}</b><small>@${esc(m.name.split(' ').pop().toLowerCase())}</small></div></div><div>Role: <span class="chip ok">${esc(m.role)}</span></div><button class="signout" type="button">Sign Out / Logout</button><label class="who" style="white-space:normal">Switch role (demo)<select id="persona" aria-label="Switch role">${Object.entries(PEOPLE).map(([k,p])=>`<option value="${k}" ${k===S.me?'selected':''}>${p.role}</option>`).join('')}</select></label>`;
  const [t,sub]=TITLES[S.route];
  const act=S.route==='terminology'?`<div class="menuwrap"><button class="btn pri" data-menu="addmenu" aria-haspopup="true" ${m.author?'':'disabled title="Only requesters and terminology specialists can add terminology"'}>+ Add Terminology</button><div class="menu" id="addmenu" hidden><button data-new="code">New local code<small>With its standard mapping</small></button><button data-new="vs">New ValueSet<small>An explicit list of codes</small></button><button data-new="cs">New code system<small>A source system's own codes</small></button></div></div>`:S.route==='kpis'?`<button class="btn pri" data-new="kpi" ${m.author?'':'disabled title="Only requesters and terminology specialists can add"'}>+ Add KPI</button>`:S.route==='elements'?`<button class="btn pri" data-new="el" ${m.author?'':'disabled title="Only requesters and terminology specialists can add"'}>+ Add Data Element</button>`:S.route==='schemas'?`<button class="btn pri" data-new="ds" ${m.author?'':'disabled title="Only requesters and terminology specialists can add"'}>+ Add Schema</button>`:'';
  const body=({catalogue:rCatalogue,queue:rQueue,terminology:rTerm,kpis:rKpis,elements:rEls,schemas:rSchemas,releases:rRel,audit:rAudit})[S.route]();
  $('#main').innerHTML=`<div class="note">Proposal mockup with sample data. Use <b>Show what changed</b> to see each change against the current screens.</div><nav class="crumb" aria-label="Breadcrumb">Home › ${esc(t)}</nav><section class="hero"><div class="hicon">${svg(S.route,26)}</div><div class="htxt"><h1>${esc(t)}</h1><p>${esc(sub)}</p></div><div class="hact">${act}</div></section>`+body;
  annotate();
}

/* ----- cards ----- */
function mapBox(c){
  if(!c.target)return `<div class="mapbox"><span class="ml">MAPS TO</span><div><span class="chip warn">No standard target yet</span></div><div class="dim">Records load as terminology-unresolved until a mapping is approved.</div></div>`;
  const r=lookup(c.target.sys,c.target.code);
  return `<div class="mapbox"><span class="ml">MAPS TO</span><div>${sysChip(c.target.sys)} <b class="mono">${esc(c.target.code)}</b> <span class="chip ${c.equiv&&EQUIV[c.equiv].auto?'ok':'warn'}">${c.equiv?EQUIV[c.equiv].l:''}</span></div><div class="dim">${esc(r?r.display:'')}</div></div>`;
}
function codeCard(c,unm){
  return `<div class="card" data-open="${keyOf(c)}" tabindex="0" role="button"><div class="cardtop"><span class="codechip">${esc(c.id)}</span>${chip(c.status)}</div><h3>${esc(c.display)}</h3>${mapBox(c)}${c.clin?'<div><span class="chip warn">Clinician review</span></div>':''}<div class="cardfoot"><span>v${c.version} · ${esc(c.system)}${pchip(c)}</span>${unm?`<button class="btn" data-map="${c.id}" ${me().author?'':'disabled'}>Map now</button>`:pips(c)}</div></div>`;
}
function rTerm(){
  const top=S.tabs.terminology,sub=S.tabs.treg,m=me();
  const nReg=DB.code.filter(inProg).length+DB.vs.filter(inProg).length+DB.cs.filter(inProg).length;
  const tabs=`<div class="tabs" role="tablist"><button role="tab" aria-selected="${top==='reg'}" data-ttab="reg">NDD Terminology Registry<span class="n">${nReg}</span></button><button role="tab" aria-selected="${top==='ref'}" data-ttab="ref">Reference Terminology <span class="dot" title="Connected"></span></button></div>`;
  if(top==='ref')return tabs+refView();
  const un=DB.code.filter(inProg).filter(c=>!c.target);
  const segs=[['codes','Local codes',DB.code.filter(inProg).length],['unmapped','Unmapped',un.length],['vs','ValueSets',DB.vs.filter(inProg).length],['cs','Code systems',DB.cs.filter(inProg).length]];
  let body='';
  if(sub==='codes'||sub==='unmapped'){
    let list=sub==='unmapped'?un:DB.code.filter(inProg);
    if(S.q)list=list.filter(c=>(c.id+c.display).toLowerCase().includes(S.q.toLowerCase()));
    if(sub==='codes'&&S.stat!=='all')list=list.filter(c=>c.status===S.stat);
    if(sub==='codes'&&S.sysf!=='all')list=list.filter(c=>S.sysf==='none'?!c.target:(c.target&&c.target.sys===S.sysf));
    body=`<div class="bar"><input type="text" id="q" placeholder="Search local code or name" value="${esc(S.q)}" aria-label="Search">${sub==='codes'?`<select id="stat" aria-label="Status"><option value="all">All statuses</option>${Object.keys(STATUS).map(s=>`<option value="${s}" ${S.stat===s?'selected':''}>${STATUS[s][0]}</option>`).join('')}</select><select id="sysf" aria-label="Standard system"><option value="all">All standard systems</option>${Object.entries(SYS).map(([k,v])=>`<option value="${k}" ${S.sysf===k?'selected':''}>${v.label}</option>`).join('')}<option value="none" ${S.sysf==='none'?'selected':''}>No standard target</option></select>`:''}</div>`+
      (sub==='unmapped'?`<p class="lede">These codes have no standard equivalent yet. Their records load as terminology-unresolved until a mapping is approved.</p>`:'')+
      (list.length?`<div class="grid">${list.map(c=>codeCard(c,sub==='unmapped')).join('')}</div>`:`<div class="tw"><div class="empty">No codes match.</div></div>`);
  }
  if(sub==='vs'){
    body=`<p class="lede">ValueSets list their codes one by one. They do not use filters or hierarchy, because GPS has none.</p><div class="grid">`+DB.vs.filter(inProg).map(v=>{const u=usedBy(v.id);return `<div class="card" data-open="${keyOf(v)}" tabindex="0" role="button"><div class="cardtop"><span class="codechip">${esc(v.id)}</span>${chip(v.status)}</div><h3>${esc(v.title)}</h3><div class="mapbox"><span class="ml">MEMBERS</span><div>${v.members.length?v.members.length+(v.members.length===1?' explicit code':' explicit codes'):'<span class="chip bad">No codes</span>'}</div><div class="dim">Used by ${u.kpis.length} KPI${u.kpis.length===1?'':'s'} and ${u.els.length} element${u.els.length===1?'':'s'}</div></div><div class="cardfoot"><span>v${v.version}${pchip(v)}</span>${pips(v)}</div></div>`}).join('')+'</div>';
  }
  if(sub==='cs'){
    body=`<p class="lede">A local code system is the list of codes one source system uses. Every local code belongs to one.</p><div class="grid">`+DB.cs.filter(inProg).map(c=>`<div class="card" data-open="${keyOf(c)}" tabindex="0" role="button"><div class="cardtop"><span class="codechip">${esc(c.id)}</span>${chip(c.status)}</div><h3>${esc(c.title)}</h3><div class="mapbox"><span class="ml">MAINTAINED BY</span><div>${esc(c.owner)}</div><div class="dim">${DB.code.filter(x=>x.system===c.id).length} local codes</div></div><div class="cardfoot"><span>v${c.version}${pchip(c)}</span>${pips(c)}</div></div>`).join('')+'</div>';
  }
  return tabs+`<div class="seg" role="tablist">${segs.map(([k,l,n])=>`<button role="tab" aria-selected="${sub===k}" data-tsub="${k}">${l}<span class="n">${n}</span></button>`).join('')}</div>`+body;
}
function refResults(){
  const q=(S.rq||'').toLowerCase(),sys=S.rsys||'all';
  const rs=REF.filter(r=>(sys==='all'||r.sys===sys)&&(!q||(r.code+' '+r.display).toLowerCase().includes(q))).slice(0,18);
  return rs.length?`<div class="grid">${rs.map(r=>`<div class="card static"><div class="cardtop">${sysChip(r.sys)}${r.active?'<span class="chip ok">Active</span>':'<span class="chip bad">Inactive</span>'}</div><h3 class="mono">${esc(r.code)}</h3><div>${esc(r.display)}</div><div class="cardfoot"><span>Read only</span><button class="btn" data-usemap="${r.sys}|${esc(r.code)}" ${r.active&&me().author?'':'disabled'}>Use in a mapping</button></div></div>`).join('')}</div>`:`<div class="tw"><div class="empty">No match on the country terminology server.</div></div>`;
}
function refView(){
  return `<div class="refbar"><b><span class="dot"></span> Country terminology server</b><span class="dim">Connected. Read only. The NDD keeps a reference to a code and its system, never a copy.</span><span class="sp"></span>${Object.values(SYS).map(x=>`<span class="sys">${x.short}</span>`).join(' ')}<span class="chip muted">ICD-11 not enabled</span></div><div class="bar"><input type="text" id="rq" placeholder="Search a standard code or name" value="${esc(S.rq)}" aria-label="Search standard codes"><select id="rsys" aria-label="System"><option value="all">All systems</option>${Object.entries(SYS).map(([k,v])=>`<option value="${k}" ${S.rsys===k?'selected':''}>${v.label}</option>`).join('')}</select></div><div id="rres">${refResults()}</div>`;
}
function rKpis(){
  const m=me(),add=m.author?'':'disabled title="Only requesters and terminology specialists can create KPIs"';
  const list=DB.kpi.filter(inProg);
  return `<div class="bar"><span class="dim">Facility comes from the facility registry and is not part of the KPI rule.</span><span class="sp"></span><button class="btn pri" data-new="kpi" ${add}>New KPI</button></div><div class="grid">`+list.map(k=>`<div class="card" data-open="${keyOf(k)}" tabindex="0" role="button"><div class="cardtop"><span class="codechip">${k.id}</span>${chip(k.status)}</div><h3>${esc(k.title)}</h3><div class="mapbox"><span class="ml">RULE</span><div>${ruleText(k.numer)}</div><div class="dim">out of</div><div>${ruleText(k.denom)}</div></div><div class="cardfoot"><span>v${k.version} · ${k.dims.map(d=>dimLabel[d]).join(', ')}${pchip(k)}</span>${k.sync?(k.sync.ver===k.version?'<span class="chip ok">DHIS2 in sync</span>':'<span class="chip warn">DHIS2 behind</span>'):'<span class="chip muted">Not in DHIS2</span>'}</div></div>`).join('')+'</div>';
}
function rEls(){
  const m=me(),add=m.author?'':'disabled title="Only requesters and terminology specialists can add elements"';
  return `<div class="bar"><span class="sp"></span><button class="btn pri" data-new="el" ${add}>New data element</button></div><div class="grid">`+DB.el.filter(inProg).map(e=>`<div class="card" data-open="${keyOf(e)}" tabindex="0" role="button"><div class="cardtop"><span class="codechip">${e.id}</span>${chip(e.status)}</div><h3>${esc(e.title)}</h3><div class="mapbox"><span class="ml">SOURCE</span><div>${esc(srcLabel(e))}</div><div class="dim mono">${esc(fhirTxt(e))}</div><div class="dim">${e.type}, ${e.card}</div><div>${e.vs?`Bound to <span class="mono">${e.vs}</span> (${e.strength})`:(e.type==='code'?'<span class="chip bad">No ValueSet bound</span>':'<span class="dim">No binding needed</span>')}</div></div><div class="cardfoot"><span>v${e.version} · ${e.sens}${pchip(e)}</span></div></div>`).join('')+'</div>';
}
function catList(){
  const q=(S.cq||'').toLowerCase();
  const items=all().filter(i=>i.status==='published'&&inProg(i)&&['kpi','el','vs','code'].includes(i.kind)&&(S.ctype==='all'||i.kind===S.ctype)&&(!q||(i.id+' '+(i.title||i.display||'')).toLowerCase().includes(q)));
  const line=i=>i.kind==='kpi'?esc(i.definition):i.kind==='el'?esc(i.def):i.kind==='vs'?i.members.length+(i.members.length===1?' explicit code':' explicit codes'):esc(i.display)+(i.target?' → '+SYS[i.target.sys].short+' '+esc(i.target.code):'');
  return items.length?`<div class="grid">${items.map(i=>`<div class="card" data-open="${keyOf(i)}" tabindex="0" role="button"><div class="cardtop"><span class="kind">${KIND[i.kind]}</span><span class="chip solid">v${i.version}</span></div><h3>${esc(i.kind==='code'?i.id:(i.title||i.id))}</h3><div class="dim">${line(i)}</div><div class="cardfoot"><span class="mono">${esc(i.id)}</span><span>${esc(progName(i.prog))}</span></div></div>`).join('')}</div>`:`<div class="tw"><div class="empty">Nothing released matches.</div></div>`;
}
function rCatalogue(){
  const types=[['all','All'],['kpi','KPIs'],['el','Data elements'],['vs','ValueSets'],['code','Local codes']];
  return `<div class="bar"><input type="text" id="cq" placeholder="Search released definitions" value="${esc(S.cq)}" aria-label="Search catalogue"></div><div class="seg" role="tablist">${types.map(([k,l])=>`<button role="tab" aria-selected="${S.ctype===k}" data-ctype="${k}">${l}</button>`).join('')}</div><div id="catres">${catList()}</div>`;
}

/* ----- change markers and legend ----- */
const CHG=[
 ['Governance group','Only the four registers.','Adds Review Queue, Schemas, Releases and Audit Log.','The SoR needs proposal, review, approval and release tag, with traceability.'],
 ['Reference tab','"FHIR Terminology Browser (HAPI FHIR R4)" with server URL, auth client, API paths and copies of SNOMED and ICD-11.','"Reference Terminology": read-only lookup on the country server. No copies, no connection details.','Standard terminologies belong to the country server. Keeping no copies means one source of truth.'],
 ['Registry sections','ConceptMaps, Concepts & Codes, CodeSystems, ValueSets (FHIR resource names).','Local codes, Unmapped, ValueSets, Code systems.','Users think in codes and mappings, not FHIR resources.'],
 ['Mapping display','"Mapped to [C50.9] … via ConceptMap [undefined]" under a code used as the title.','Name as the title, then a Maps-to box with system, full code, name and equivalence.','Fixes the undefined bug and the truncated codes.'],
 ['Status','ACTIVE on a draft mapping.','A governance state: Draft, Submitted, In review, Approved, Published.','ACTIVE hid that the mapping still needed clinician review.'],
 ['Add menu','One "Add Terminology" button and one form.','Menu: local code, ValueSet, code system.','Each has different fields and a different reviewer question.'],
 ['Local code system','Domain dropdown with one value, "HEALTH".','A real code system list with "+ New code system" inline.','A local code has no meaning without the system that owns it.'],
 ['Standard code lookup','Typed code "1435" and a hand-typed display.','Search on the country server. Name is read-only. Inactive codes cannot be chosen.','1435 is not a valid SNOMED ID. Typed targets cause silent errors.'],
 ['Equivalence','Defaults to "equal".','No default. A line shows what ETL will do with the choice.','ETL applies equal and wider automatically, so a lazy default becomes a silent error.'],
 ['Reason and review','Description only.','A required reason, plus "needs clinician review".','Reviewers need the why. Diagnosis mappings need clinical sign-off.'],
 ['Save','"Save Mapping Entry".','Save draft, or Submit for review.','Nothing reaches ETL without review.'],
 ['ValueSets','Expand ValueSet ($expand), no version, no usage.','Explicit code list, version, member count and what uses it. No $expand.','GPS has no hierarchy, so expansion rules cannot run.'],
 ['Role','A "Requester" badge only.','The role decides what you can do. Reviewers cannot approve their own work.','Separation of duties.'],
 ['Git workflow','Not shown. Governance looks like an in-app approval.','Each change is a branch and pull request on a YAML file. Review is the pull request review, validation is CI, publishing is merge plus a release tag.','The SoR says: Git repository with YAML or JSON files, proposal, review, approval, merge, release tag, mandatory PR review and automated validation.'],
 ['Review panel','No review step on screen.','Lifecycle bar, automatic checks, two approvals, discussion, and what it feeds.','Gives reviewers what they need to decide.']
];
function annotate(){
  document.querySelectorAll('[data-chg]').forEach(e=>e.removeAttribute('data-chg'));
  const m=(sel,n)=>{const e=document.querySelector(sel);if(e)e.setAttribute('data-chg',n)};
  m('#nav [data-go="queue"]',1);m('[data-ttab="ref"]',2);m('[data-tsub="codes"]',3);m('.grid .card .mapbox',4);m('.grid .card .cardtop .chip',5);m('[data-menu="addmenu"]',6);
  if(S.tabs.treg==='vs')m('.grid .card .mapbox',12);
  m('.ucard',13);
  m('[data-fr="f-sys"]',7);m('[data-fr="f-search"]',8);m('[data-fr="f-equiv"]',9);m('[data-fr="f-reason"]',10);m('[data-save="draft"]',11);
  m('.drawer .steps',15);document.querySelectorAll('.drawer .sec').forEach(x=>{const h=x.querySelector('h4');if(h&&h.textContent==='Git')x.setAttribute('data-chg',14)});
}
function legend(){
  const L=$('#legend');L.innerHTML=`<h2>What changed <button class="x" id="lclose" aria-label="Close">×</button></h2><p class="dim" style="margin:0">Numbers match the dashed markers on the screens. Open Add Terminology to see 6 to 11, and any card for 14 and 15.</p><ol>${CHG.map((c,i)=>`<li><span class="num">${i+1}</span><div><b>${c[0]}</b><div class="ba"><span>Before</span><span style="font-weight:400;color:var(--ink)">${c[1]}</span></div><div class="ba"><span>After</span><span style="font-weight:400;color:var(--ink)">${c[2]}</span></div><div class="why">${c[3]}</div></div></li>`).join('')}</ol>`;
}
function setAnnot(on){document.body.classList.toggle('annot',on);$('#annot').setAttribute('aria-pressed',on?'true':'false');$('#legend').hidden=!on;if(on)legend()}

/* ----- extra events ----- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tsub],[data-menu],[data-usemap],[data-ctype],#annot,#theme,#collapse,#lclose');
  const menu=$('#addmenu');
  if(menu&&!e.target.closest('.menuwrap'))menu.hidden=true;
  if(!t)return;const d=t.dataset;
  if(d.tsub){S.tabs.treg=d.tsub;S.q='';render()}
  else if(d.menu){const mm=$('#'+d.menu);if(mm)mm.hidden=!mm.hidden}
  else if(d.usemap){const [sy,cd]=d.usemap.split('|');openMapForm(null);MF.tsys=sy;document.getElementById('f-tsys').value=sy;MF.picked={sys:sy,code:cd};mapDyn();document.getElementById('f-results').innerHTML=''}
  else if(d.ctype){S.ctype=d.ctype;render()}
  else if(t.id==='annot')setAnnot(!document.body.classList.contains('annot'));
  else if(t.id==='lclose')setAnnot(false);
  else if(t.id==='theme'){try{const r=document.documentElement;const dark=r.getAttribute('data-theme')?r.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.setAttribute('data-theme',dark?'light':'dark')}catch(_){}}
  else if(t.id==='collapse'){$('#gbody').classList.toggle('mini')}
});
document.addEventListener('click',e=>{if(e.target.closest('#addmenu [data-new]')){const m=$('#addmenu');if(m)m.hidden=true}},true);
document.addEventListener('input',e=>{
  if(e.target.id==='rq'){S.rq=e.target.value;$('#rres').innerHTML=refResults()}
  if(e.target.id==='cq'){S.cq=e.target.value;$('#catres').innerHTML=catList()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='rsys'){S.rsys=e.target.value;$('#rres').innerHTML=refResults()}
  if(e.target.id==='sysf'){S.sysf=e.target.value;render()}
});
document.addEventListener('input',e=>{if(e.target.id&&e.target.id.startsWith('g-'))d2update()});
document.addEventListener('change',e=>{if(e.target.id&&e.target.id.startsWith('g-'))d2update()});
new MutationObserver(()=>annotate()).observe($('#layer'),{childList:true,subtree:true});
(function init(){const h=(location.hash||'').slice(1);if(ROUTES.some(r=>r[0]===h))S.route=h;render()})();
</script>
